<style>
@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap');
:root{--deep:#062f3c;--sea:#0b5260;--foam:#eff9f4;--coral:#fa8d78;--sun:#ffd891;--mint:#a8dbc4}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--deep);color:var(--foam);font-family:"Manrope",sans-serif}
.hero{position:relative;min-height:100svh;overflow:hidden;isolation:isolate;background:radial-gradient(ellipse at 48% 16%,#297d83 0%,#115967 34%,#083f4f 67%,#062f3c 100%)}
.hero:before,.hero:after{content:"";position:absolute;inset:-10%;z-index:-1;pointer-events:none}
.hero:before{opacity:.16;background:repeating-linear-gradient(108deg,transparent 0 10%,#b6e8d3 10.4%,transparent 15% 29%);filter:blur(24px);transform:translateX(-8%);animation:light 22s ease-in-out infinite alternate}
.hero:after{inset:auto -5% -1px;height:29%;background:linear-gradient(180deg,transparent,#052c36 90%);z-index:1}
nav{position:absolute;z-index:5;top:0;left:0;width:100%;display:flex;justify-content:space-between;align-items:center;padding:27px clamp(22px,6vw,84px)}
.wordmark{font-size:1.1rem;letter-spacing:.16em;text-transform:lowercase;font-weight:700;color:#f2fbf5;text-decoration:none}
.nav-note{font-size:.72rem;letter-spacing:.19em;text-transform:uppercase;color:#c5e5d8}
.content{position:relative;z-index:3;width:min(780px,90vw);text-align:center;margin:0 auto;padding:clamp(146px,20vh,210px) 0 220px;animation:content-float 7s ease-in-out infinite}
.eyebrow{display:inline-flex;align-items:center;gap:10px;color:#c4e8d9;font-size:.72rem;font-weight:600;letter-spacing:.24em;text-transform:uppercase}
.eyebrow:before,.eyebrow:after{content:"";width:25px;height:1px;background:#a8dbc4}
h1{font-family:"Fraunces",Georgia,serif;font-weight:500;font-size:clamp(3.5rem,10vw,7.2rem);line-height:.95;letter-spacing:-.045em;margin:26px 0 22px;text-shadow:0 5px 32px #092e3c55}
h1 em{font-style:normal;color:var(--sun)}
.intro{max-width:510px;margin:0 auto;color:#d4ebe1;font-size:clamp(1rem,2.1vw,1.18rem);line-height:1.75}
.status{display:inline-flex;align-items:center;gap:11px;margin-top:34px;padding:12px 19px;border:1px solid #c1e4d455;border-radius:100px;color:#f6fbf5;background:#e5fff00b;font-size:.75rem;letter-spacing:.16em;text-transform:uppercase}
.status i{width:8px;height:8px;border-radius:50%;background:var(--coral);box-shadow:0 0 0 5px #fa8d7820;animation:pulse 2.5s ease-in-out infinite}
.scene{position:absolute;z-index:2;inset:0;pointer-events:none;overflow:hidden}
.rays{position:absolute;inset:0;width:100%;height:100%;opacity:.12;filter:blur(18px)}
.bubble{position:absolute;border:1px solid #d5f4e999;border-radius:50%;background:radial-gradient(circle at 33% 29%,#e7fff777,transparent 57%);animation:rise var(--d,12s) linear infinite;animation-delay:var(--delay,0s);left:var(--x);bottom:-30px;width:var(--s,12px);height:var(--s,12px)}
.bubble:nth-child(2){--x:18%;--s:8px;--d:15s;--delay:-6s}.bubble:nth-child(3){--x:28%;--s:15px;--d:18s;--delay:-12s}.bubble:nth-child(4){--x:71%;--s:10px;--d:14s;--delay:-8s}.bubble:nth-child(5){--x:83%;--s:6px;--d:13s;--delay:-3s}.bubble:nth-child(6){--x:91%;--s:16px;--d:19s;--delay:-14s}.bubble:nth-child(7){--x:61%;--s:7px;--d:16s;--delay:-10s}.bubble:nth-child(8){--x:43%;--s:9px;--d:13s;--delay:-4s}
.bubble:nth-child(9){--x:8%;--s:5px;--d:12s;--delay:-5s}.bubble:nth-child(10){--x:34%;--s:13px;--d:17s;--delay:-11s}.bubble:nth-child(11){--x:53%;--s:7px;--d:14s;--delay:-7s}.bubble:nth-child(12){--x:77%;--s:11px;--d:18s;--delay:-12s}.bubble:nth-child(13){--x:96%;--s:5px;--d:13s;--delay:-9s}.bubble:nth-child(14){--x:14%;--s:10px;--d:16s;--delay:-14s}.bubble:nth-child(15){--x:38%;--s:6px;--d:11s;--delay:-4s}.bubble:nth-child(16){--x:66%;--s:14px;--d:20s;--delay:-16s}.bubble:nth-child(17){--x:87%;--s:8px;--d:15s;--delay:-6s}.bubble:nth-child(18){--x:24%;--s:12px;--d:19s;--delay:-15s}.bubble:nth-child(19){--x:48%;--s:5px;--d:13s;--delay:-10s}.bubble:nth-child(20){--x:73%;--s:9px;--d:16s;--delay:-8s}.bubble:nth-child(21){--x:4%;--s:7px;--d:12s;--delay:-3s}.bubble:nth-child(22){--x:58%;--s:11px;--d:17s;--delay:-13s}.bubble:nth-child(23){--x:93%;--s:6px;--d:14s;--delay:-5s}.bubble:nth-child(24){--x:52%;--s:8px;--d:16s;--delay:-12s}.life{position:absolute;display:block}.screen-star{position:fixed;z-index:2;top:-110px;right:8vw;width:clamp(50px,6vw,76px);filter:drop-shadow(0 7px 0 #d56f65) drop-shadow(0 13px 12px #062b3d66);animation:star-drift 25s linear infinite;pointer-events:none}
.fish{width:clamp(53px,8vw,92px);filter:drop-shadow(0 6px 12px #062b3d55);animation:swim 6s ease-in-out infinite}
.fish-one{top:27%;left:12%;--flip:1}.fish-two{top:39%;right:12%;--flip:-1;animation-delay:-2s;width:clamp(42px,6vw,70px)}
.jelly{width:74px;top:36%;right:24%;animation:bob 7s ease-in-out infinite;filter:drop-shadow(0 8px 15px #062b3d55)}.turtle{width:110px;top:25%;right:29%;animation:swim 9s ease-in-out infinite;filter:drop-shadow(0 8px 15px #062b3d55)}.ray{width:120px;top:58%;right:33%;animation:swim 8s ease-in-out infinite reverse;filter:drop-shadow(0 8px 15px #062b3d55)}.crab{width:94px;right:43%;bottom:8%;animation:bob 6s ease-in-out infinite;filter:drop-shadow(0 8px 15px #062b3d55)}.seahorse{width:80px;top:54%;left:17%;animation:bob 5s ease-in-out infinite;filter:drop-shadow(0 8px 15px #062b3d66)}
.star{width:82px;right:18%;bottom:12%;animation:bob 6s ease-in-out infinite reverse;filter:drop-shadow(0 8px 15px #062b3d66)}
.coral{position:absolute;bottom:-2px;width:min(25vw,270px);height:255px;transform-origin:bottom center;animation:sway 7s ease-in-out infinite}
.coral-left{left:4%;}.coral-right{right:4%;width:min(29vw,310px);height:280px;animation-delay:-3s}
.seaweed{position:absolute;bottom:0;width:160px;height:350px;transform-origin:bottom center;animation:sway 5s ease-in-out infinite}
.weed-left{left:24%;}.weed-right{right:24%;animation-delay:-2.5s}
footer{position:absolute;bottom:22px;left:0;right:0;z-index:4;text-align:center;color:#c2e0d5a6;font-size:.7rem;letter-spacing:.1em}
@keyframes content-float{0%,100%{translate:0 0}50%{translate:0 -9px}}
@keyframes star-drift{0%{transform:translateY(-10vh) rotate(-12deg)}12%{transform:translateY(12vh) rotate(0deg)}48%{transform:translateY(48vh) rotate(12deg)}84%{transform:translateY(84vh) rotate(0deg)}100%{transform:translateY(112vh) rotate(-12deg)}}
@keyframes rise{0%{transform:translate3d(0,0,0);opacity:0}10%{opacity:.7}90%{opacity:.35}100%{transform:translate3d(24px,-110vh,0);opacity:0}}
@keyframes swim{0%,100%{transform:translate(0,0) scaleX(var(--flip,1))}50%{transform:translate(24px,-11px) scaleX(var(--flip,1))}}
@keyframes bob{0%,100%{translate:0 0;rotate:-4deg}50%{translate:0 -14px;rotate:4deg}}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(4deg)}}
@keyframes light{to{transform:translateX(8%) translateY(3%);opacity:.34}}
@keyframes pulse{50%{box-shadow:0 0 0 8px #fa8d780a;opacity:.65}}
@media(max-width:650px){nav{padding:22px 22px}.nav-note{font-size:.58rem}.content{padding-top:clamp(150px,22vh,190px);padding-bottom:250px}.intro{max-width:360px}.fish-one{top:20%;left:5%}.fish-two{top:46%;right:4%}.seahorse{width:48px;top:57%;left:7%}.jelly{width:52px;top:45%;right:7%}.turtle{width:70px;top:24%;right:6%}.ray{width:83px;top:63%;right:27%}.crab{width:68px;right:43%;bottom:7%}.star{width:60px;right:8%;bottom:15%}.coral{width:35vw;height:190px}.coral-left{left:-5%}.coral-right{width:37vw;height:220px;right:-5%}.seaweed{height:260px;width:100px}.weed-left{left:22%}.weed-right{right:20%}.hero:after{height:25%}}
@media(max-width:650px){.screen-star{right:3vw;width:48px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}}
