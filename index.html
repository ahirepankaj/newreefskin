<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#082f40">
<meta name="description" content="A new tide is coming. Discover newreef™ at newreefskin.com.">
<title>Coming Soon | newreefskin.com</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap');
:root{--ink:#f4f8f2;--soft:#d7e9e1;--sea:#062c3a;--peach:#ffc29b}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--sea)}
body{font-family:"Manrope",sans-serif;color:var(--ink)}
.hero{position:relative;min-height:100svh;overflow:hidden;isolation:isolate;background:#073348}
.hero:before,.hero:after{content:"";position:absolute;inset:0;pointer-events:none}
.hero:before{z-index:-3;background-image:url("reef-realistic-animated.png");background-size:cover;background-position:center center}
.hero:after{z-index:-1;background:linear-gradient(90deg,#052b3b66,#052b3b40 30%,#052b3b59 72%,#052b3b66),linear-gradient(0deg,#052d3fc9 0%,#052d3f55 27%,#052d3f22 68%,#052d3f44 100%)}
.reef-video{position:absolute;z-index:-2;inset:0;width:100%;height:100%;object-fit:cover;object-position:center center;filter:brightness(.82) saturate(.92)}
nav{position:absolute;z-index:4;top:0;left:0;width:100%;display:flex;justify-content:space-between;align-items:center;padding:28px clamp(22px,6vw,84px)}
.wordmark{font-size:1.08rem;letter-spacing:.15em;text-transform:lowercase;font-weight:700;color:var(--ink);text-decoration:none;text-shadow:0 2px 14px #052936aa}
.nav-note{font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;color:#d6e8df;text-shadow:0 2px 12px #052936aa}
.content{position:relative;z-index:3;width:min(790px,90vw);min-height:100svh;margin:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:130px 0 150px;animation:content-float 7s ease-in-out infinite}
.eyebrow{display:inline-flex;align-items:center;gap:12px;color:#deeee4;font-size:.7rem;font-weight:600;letter-spacing:.27em;text-transform:uppercase;text-shadow:0 2px 14px #052936}
.eyebrow:before,.eyebrow:after{content:"";width:28px;height:1px;background:#c4e4d7}
h1{font-family:"Fraunces",Georgia,serif;font-weight:500;font-size:clamp(3.6rem,10vw,7.6rem);line-height:.93;letter-spacing:-.045em;margin:25px 0 24px;text-shadow:0 4px 32px #042733b8}
h1 em{font-style:normal;color:#ffd4aa}
.intro{max-width:520px;margin:0 auto;color:#e4f0e9;font-size:clamp(1rem,2vw,1.16rem);line-height:1.75;text-shadow:0 2px 16px #042733}
.status{display:inline-flex;align-items:center;gap:11px;margin-top:32px;padding:12px 19px;border:1px solid #e0f1e177;border-radius:100px;color:#f8fbf6;background:#d8f4e81b;box-shadow:inset 0 1px #ffffff1a,0 5px 25px #04273355;backdrop-filter:blur(8px);font-size:.7rem;letter-spacing:.18em;text-transform:uppercase}
.status i{width:8px;height:8px;border-radius:50%;background:#ffb293;box-shadow:0 0 0 5px #ffb2932a;animation:pulse 2.5s ease-in-out infinite}
.bubbles{position:absolute;z-index:1;inset:0;overflow:hidden;pointer-events:none}
.bubble{position:absolute;left:var(--x);bottom:-35px;width:var(--s);height:var(--s);border:1px solid #e3f5f0a6;border-radius:50%;background:radial-gradient(circle at 33% 27%,#f2ffffbf 0 9%,#c8edf255 24%,#e3ffff0c 68%);box-shadow:inset -2px -2px 4px #d4faff22,0 0 8px #bbf3f622;animation:bubble-rise var(--dur) linear var(--delay) infinite}
footer{position:absolute;bottom:22px;left:0;right:0;z-index:3;text-align:center;color:#deebe1bf;font-size:.68rem;letter-spacing:.12em;text-shadow:0 1px 12px #041e2b}
@keyframes content-float{0%,100%{translate:0 0}50%{translate:0 -8px}}
@keyframes bubble-rise{0%{transform:translate3d(0,0,0) scale(.8);opacity:0}12%{opacity:.7}88%{opacity:.45}100%{transform:translate3d(20px,-110vh,0) scale(1.12);opacity:0}}
@keyframes pulse{50%{box-shadow:0 0 0 8px #ffb29310;opacity:.68}}
@media(max-width:650px){nav{padding:22px}.nav-note{font-size:.55rem;letter-spacing:.13em}.content{width:88vw;padding:125px 0 142px}h1{font-size:clamp(3.35rem,15vw,5.2rem)}.intro{max-width:390px}.hero:before{background-position:48% center}.reef-video{object-position:48% center}footer{padding:0 18px;font-size:.6rem}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}.reef-video{display:none}}
</style>
</head>
<body>
<main class="hero">
<video class="reef-video" autoplay muted loop playsinline preload="metadata" poster="reef-realistic-animated.png" aria-hidden="true"><source src="https://videos.pexels.com/video-files/33028283/14078367_1920_1080_60fps.mp4" type="video/mp4"></video>
<nav aria-label="Main navigation"><a class="wordmark" href="#" aria-label="newreef trademark home">newreef™</a><span class="nav-note">A new tide is on the way</span></nav>
<div class="bubbles" aria-hidden="true">
<span class="bubble" style="--x:7%;--s:9px;--dur:15s;--delay:-7s"></span><span class="bubble" style="--x:15%;--s:14px;--dur:19s;--delay:-13s"></span><span class="bubble" style="--x:23%;--s:7px;--dur:12s;--delay:-5s"></span><span class="bubble" style="--x:34%;--s:11px;--dur:17s;--delay:-11s"></span><span class="bubble" style="--x:43%;--s:6px;--dur:14s;--delay:-9s"></span><span class="bubble" style="--x:52%;--s:13px;--dur:21s;--delay:-17s"></span><span class="bubble" style="--x:64%;--s:8px;--dur:16s;--delay:-6s"></span><span class="bubble" style="--x:72%;--s:5px;--dur:13s;--delay:-8s"></span><span class="bubble" style="--x:81%;--s:12px;--dur:19s;--delay:-15s"></span><span class="bubble" style="--x:93%;--s:8px;--dur:15s;--delay:-10s"></span><span class="bubble" style="--x:28%;--s:10px;--dur:18s;--delay:-14s"></span><span class="bubble" style="--x:58%;--s:6px;--dur:12s;--delay:-3s"></span><span class="bubble" style="--x:88%;--s:15px;--dur:22s;--delay:-18s"></span><span class="bubble" style="--x:4%;--s:5px;--dur:13s;--delay:-4s"></span><span class="bubble" style="--x:76%;--s:7px;--dur:16s;--delay:-12s"></span><span class="bubble" style="--x:48%;--s:9px;--dur:17s;--delay:-7s"></span>
</div>
<section class="content" aria-labelledby="headline"><div class="eyebrow">Ocean inspired care</div><h1 id="headline">A new tide<br>is <em>coming.</em></h1><p class="intro">Meet newreef™ — ocean inspired bath and body care is on its way.</p><div class="status"><i aria-hidden="true"></i> Coming soon</div></section>
<footer>Made for slower moments · Coming soon at newreefskin.com</footer>
</main>
</body>
</html>
